# GitHub Actions 워크플로 (아직 등록하지 않음)
# 쓰려면 이 파일을 .github/workflows/ci.yml 로 올린다. 토큰으로 push 할 때는 토큰에 workflow 권한이 있어야 하고,
# GitHub 웹(Add file → Create new file)에서 만들면 권한 없이 올릴 수 있다.
#
# CI: 컴파일 + ktlint + detekt + 테스트(Testcontainers) + 커버리지 검증
name: CI

on:
  pull_request:
  push:
    branches:
      - main

# 같은 ref 에서 새 실행이 시작되면 진행 중인 이전 실행을 취소한다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build / Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # 테스트는 Testcontainers 로 MySQL, Redis 를 띄운다 (GitHub 호스트 러너에는 Docker 가 있다)
      - name: Build
        run: ./gradlew build -Pcoverage

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: build/reports/
