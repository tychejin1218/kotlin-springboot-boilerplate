# SERVER 설정
server:
  port: 9091
  servlet:
    context-path: /api
  shutdown: graceful

# SPRING 설정
spring:
  application:
    name: kotlin-springboot-boilerplate
  web:
    locale: ko_KR
    resources:
      add-mappings: false
  jackson:
    time-zone: UTC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true
        use_sql_comments: true
  profiles:
    active: local
    group:
      local: profiles-local, logging-type-console, logging-level-local
      dev: profiles-dev, logging-type-file-absolute, logging-level-dev
      stg: profiles-stg, logging-type-file-absolute, logging-level-stg
      prd: profiles-prd, logging-type-file-absolute, logging-level-prd

# MyBatis 설정 (DataSource·트랜잭션은 JPA 와 공유)
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.api.**.dto
  configuration:
    map-underscore-to-camel-case: true
    # Kotlin data class(val) 에 생성자 파라미터 이름으로 매핑 (build.gradle.kts 의 javaParameters 필요)
    arg-name-based-constructor-auto-mapping: true

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  metrics:
    tags:
      application: ${spring.application.name}

---
spring.config.activate.on-profile: profiles-local
spring.config.import: classpath:config/datasource/datasource-local.yml
management.endpoint.health.show-details: always

---
spring.config.activate.on-profile: profiles-dev
spring.config.import: classpath:config/datasource/datasource-dev.yml

---
spring.config.activate.on-profile: profiles-stg
spring.config.import: classpath:config/datasource/datasource-stg.yml

---
spring.config.activate.on-profile: profiles-prd
spring.config.import: classpath:config/datasource/datasource-prd.yml
