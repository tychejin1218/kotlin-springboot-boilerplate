# SERVER 설정
server:
  port: 9091
  servlet:
    context-path: /api
  shutdown: graceful

# SPRING 설정
spring:
  application:
    name: kotlin-springboot-boilerplate
  web:
    locale: ko_KR
    resources:
      add-mappings: false
  jackson:
    time-zone: UTC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    # 날짜 컬럼은 UTC 로 저장한다. JVM 기본 시간대를 UTC 로 고정하므로(ApiApplication.main) 별도 변환 설정은 두지 않는다
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  profiles:
    active: local
    group:
      local: profiles-local, logging-type-console, logging-level-local
      dev: profiles-dev, logging-type-file-absolute, logging-level-dev
      stg: profiles-stg, logging-type-file-absolute, logging-level-stg
      prd: profiles-prd, logging-type-file-absolute, logging-level-prd

# 메일 내용 (SMTP 접속은 spring.mail.*). 링크 경로는 FE 라우트(react-boilerplate/src/app/router/router.tsx)와 같아야 한다
mail:
  from: ${MAIL_FROM:noreply@example.com}
  verify-url: ${MAIL_VERIFY_URL:http://localhost:5173/verify-email}
  password-reset-url: ${MAIL_PASSWORD_RESET_URL:http://localhost:5173/password/reset}

# Rate Limit (로그인, 회원가입에 IP·경로별 분당 요청 수 제한)
rate-limit:
  max-requests-per-minute: 10
  # true 이면 X-Forwarded-For 첫 값을 클라이언트 IP 로 쓴다. 신뢰할 수 있는 리버스 프록시(ALB, nginx) 뒤에서만 켠다
  trust-forwarded-headers: ${RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}

# 세션 만료 정책. access-token-validity-ms(environment-{profile}.yml)는 session-idle-timeout-ms 보다 짧아야 한다
jwt:
  session-idle-timeout-ms: ${JWT_SESSION_IDLE_TIMEOUT_MS:1800000}          # 미활동 만료 30분
  session-absolute-timeout-ms: ${JWT_SESSION_ABSOLUTE_TIMEOUT_MS:43200000} # 최초 로그인 기준 절대 만료 12시간

# Jasypt (ENC(...) 복호화). 비밀번호는 JASYPT_ENCRYPTOR_PASSWORD 환경변수로 주입한다
jasypt:
  encryptor:
    bean: jasyptStringEncryptor

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  metrics:
    tags:
      application: ${spring.application.name}

# SpringDoc (API 문서, Swagger UI) 은 기본으로 끈다.
# local/dev/stg 는 environment-{profile}.yml 에서 켜고 prd 는 끈 채로 둔다.
# 새 프로파일을 추가해도 명시적으로 켜기 전까지는 API 문서가 노출되지 않는다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

---
spring.config.activate.on-profile: profiles-local
spring.config.import: classpath:config/datasource/datasource-local.yml, classpath:config/environment/environment-local.yml
management.endpoint.health.show-details: always

---
spring.config.activate.on-profile: profiles-dev
spring.config.import: classpath:config/datasource/datasource-dev.yml, classpath:config/environment/environment-dev.yml

---
spring.config.activate.on-profile: profiles-stg
spring.config.import: classpath:config/datasource/datasource-stg.yml, classpath:config/environment/environment-stg.yml

---
spring.config.activate.on-profile: profiles-prd
spring.config.import: classpath:config/datasource/datasource-prd.yml, classpath:config/environment/environment-prd.yml
