# SERVER 설정
server:
  port: 9091
  servlet:
    context-path: /api
  shutdown: graceful

# SPRING 설정
spring:
  application:
    name: kotlin-springboot-boilerplate
  web:
    locale: ko_KR
    resources:
      add-mappings: false
  jackson:
    time-zone: UTC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    # 날짜 컬럼은 UTC 로 저장한다. JVM 기본 시간대를 UTC 로 고정하므로(ApiApplication.main) 별도 변환 설정은 두지 않는다
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  profiles:
    active: local
    group:
      local: profiles-local, logging-type-console, logging-level-local
      dev: profiles-dev, logging-type-file-absolute, logging-level-dev
      stg: profiles-stg, logging-type-file-absolute, logging-level-stg
      prd: profiles-prd, logging-type-file-absolute, logging-level-prd

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  metrics:
    tags:
      application: ${spring.application.name}

---
spring.config.activate.on-profile: profiles-local
spring.config.import: classpath:config/datasource/datasource-local.yml
management.endpoint.health.show-details: always

---
spring.config.activate.on-profile: profiles-dev
spring.config.import: classpath:config/datasource/datasource-dev.yml

---
spring.config.activate.on-profile: profiles-stg
spring.config.import: classpath:config/datasource/datasource-stg.yml

---
spring.config.activate.on-profile: profiles-prd
spring.config.import: classpath:config/datasource/datasource-prd.yml
