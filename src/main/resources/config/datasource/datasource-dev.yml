# dev: 접속 정보는 환경변수(또는 Secrets Manager 등)로 주입한다. 저장소에 평문을 커밋하지 않는다
main:
  datasource:
    writer-jdbc-url: ${DB_WRITER_JDBC_URL}
    reader-jdbc-url: ${DB_READER_JDBC_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${DB_MINIMUM_IDLE:5}
      idle-timeout: 10000
      max-lifetime: 300000
