# CORS 허용 오리진. 쉼표로 여러 개 지정
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# API 문서는 application.yml 기본값(꺼짐)을 그대로 쓴다

# JWT
jwt:
  secret: ${JWT_SECRET}
  access-token-validity-ms: ${JWT_ACCESS_TOKEN_VALIDITY_MS:900000}  # 15분

spring:
  # Redis 클러스터 (예: node1:6379,node2:6379)
  data:
    redis:
      cluster:
        nodes: ${REDIS_CLUSTER_NODES}
      timeout: 3s
      lettuce:
        cluster:
          refresh:
            adaptive: true
            period: 60s
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}

# [예제: file-upload] S3. 자격증명은 IAM Role(DefaultCredentialsProvider)로 찾는다
aws:
  s3:
    region: ${AWS_REGION:ap-northeast-2}
    bucket-name: ${AWS_S3_BUCKET_NAME}
    presigned-url-expiry-minutes: 5
