# CORS 허용 오리진. 쉼표로 여러 개 지정
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# SpringDoc (Swagger UI: /api/swagger-ui.html, 문서 JSON: /api/api-docs)
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    groups-order: asc
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    doc-expansion: none

# JWT
jwt:
  secret: ${JWT_SECRET}
  access-token-validity-ms: ${JWT_ACCESS_TOKEN_VALIDITY_MS:900000}  # 15분

spring:
  # Redis 클러스터 (예: node1:6379,node2:6379)
  data:
    redis:
      cluster:
        nodes: ${REDIS_CLUSTER_NODES}
      timeout: 3s
      lettuce:
        cluster:
          refresh:
            adaptive: true
            period: 60s
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
