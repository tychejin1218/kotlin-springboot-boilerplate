global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'kotlin-springboot-boilerplate'
    metrics_path: /api/actuator/prometheus
    static_configs:
      # 앱을 호스트에서 bootRun 으로 띄우든 compose(app 프로파일)로 띄우든 호스트의 9091 로 열려 있다
      - targets: ['host.docker.internal:9091']
